interface:
  display_name: "Pinpoint"
  short_description: "Analyze and route research requests"
  default_prompt: "Use $pinpoint to analyze this request through 5 dimensions (causal structure, stakeholder & interest, assumption challenge, temporal context, constraint reframe), pause for user confirmation, converge to one consolidated brief, then route it to needs-confirmation, deep-research, light-answer, or skill-route. Preserve legacy top-level JSON output when routing to deep-research."
